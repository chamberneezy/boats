name: Scrape operators' special cruises

on:
  schedule:
    - cron: '40 5 * * *' # 07:40 Europe/Zurich (CEST); 06:40 once DST ends
  workflow_dispatch:

permissions:
  contents: write

# One run of this workflow at a time. The other scrapers (scrape-sgv, scrape-zsg, scrape-cgn,
# scrape-cruises, check-zsg-traffic) also commit to main at about the same time, each to its own
# files; the pull --rebase retry below settles those pushes. They must NOT share one concurrency
# group: a group holds only one waiting run, so with five workflows starting together the ones in
# the middle were cancelled (ZSG's scrape was cancelled every day from 2026-10-08 to 2026-10-11).
concurrency:
  group: scraper-cruises
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: npm ci
      # A failing operator keeps its last good data and fails the run (so it shows up here), but
      # whatever the other operators returned is still committed.
      - run: npm run scrape:cruises
        continue-on-error: true
        id: scrape
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/data/scraped/operator-cruises.json
          if git diff --cached --quiet; then
            echo "No change to commit."
          else
            git commit -m "Daily operators' cruises scrape"
            for attempt in 1 2 3 4 5 6; do
              git pull --rebase origin main && git push && break
              [ "$attempt" = 6 ] && exit 1
              sleep $((attempt * 5))
            done
          fi
      - if: steps.scrape.outcome == 'failure'
        run: |
          echo "At least one operator's cruise page could not be read; its last good data was kept."
          exit 1
