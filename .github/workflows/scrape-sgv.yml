name: Scrape SGV boat deployments

on:
  schedule:
    - cron: '10 5 * * *' # 07:10 Europe/Zurich (CEST); 06:10 once DST ends
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: npm run scrape:sgv
      # Only ever stages the scraper's own output files - never anything hand-edited.
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/data/scraped/sgv-fleet.json src/data/scraped/sgv-allocations.json src/data/scraped/sgv-trips.json
          if git diff --cached --quiet; then
            echo "No change to commit."
          else
            git commit -m "Daily SGV deployments scrape"
            git push
          fi
