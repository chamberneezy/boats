name: Check ZSG traffic conditions

on:
  schedule:
    - cron: '0 5 * * *' # 07:00 Europe/Zurich (CEST); 06:00 once DST ends
  workflow_dispatch:

permissions:
  contents: write

# One run of this workflow at a time. The other scrapers (scrape-sgv, scrape-zsg, scrape-cgn,
# scrape-cruises, check-zsg-traffic) also commit to main at about the same time, each to its own
# files; the pull --rebase retry below settles those pushes. They must NOT share one concurrency
# group: a group holds only one waiting run, so with five workflows starting together the ones in
# the middle were cancelled (ZSG's scrape was cancelled every day from 2026-10-08 to 2026-10-11).
concurrency:
  group: scraper-zsg-traffic
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # Full history, not the default shallow clone: the retry loop below rebases onto
          # origin/main if another scraper pushed first, which needs real history to work with.
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: npm ci
      - run: npm run check:zsg-traffic
      # Only ever stages the checker's own two output files - never
      # src/data/serviceChanges.json (the trips withdrawn on every platform), which stays a manual update after review.
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add scripts/zsg-traffic-report.md scripts/zsg-traffic-baseline.txt
          if git diff --cached --quiet; then
            echo "No change to commit."
          else
            git commit -m "Daily ZSG traffic-conditions check"
            # Another scraper, or a person, may have pushed to main in between.
            for attempt in 1 2 3 4 5 6; do
              git pull --rebase origin main && git push && break
              [ "$attempt" = 6 ] && exit 1
              sleep $((attempt * 5))
            done
          fi
