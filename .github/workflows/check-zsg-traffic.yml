name: Check ZSG traffic conditions

on:
  schedule:
    - cron: '0 5 * * *' # 07:00 Europe/Zurich (CEST); 06:00 once DST ends
  workflow_dispatch:

permissions:
  contents: write

# Shared with the other two scrapers (scrape-sgv.yml, scrape-cgn.yml): they all commit to main on
# their own schedule, only ~20 minutes apart, and each can run long enough to overlap the next
# one. Queues them instead of letting two pushes race (one wins, the other gets a non-fast-forward
# rejection and its scrape is lost for the day).
concurrency:
  group: scraper-git-push
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history, not the default shallow clone: the retry loop below rebases onto
          # origin/main if another scraper pushed first, which needs real history to work with.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: npm run check:zsg-traffic
      # Only ever stages the checker's own two output files - never
      # src/data/zsgTrafficConditions.ts, which stays a manual update after review.
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add scripts/zsg-traffic-report.md scripts/zsg-traffic-baseline.txt
          if git diff --cached --quiet; then
            echo "No change to commit."
          else
            git commit -m "Daily ZSG traffic-conditions check"
            # Belt-and-suspenders alongside the concurrency group above, in case something else
            # (a manual push, a person) touched main in between.
            for attempt in 1 2 3; do
              git pull --rebase origin main && git push && break
              [ "$attempt" = 3 ] && exit 1
              sleep $((attempt * 5))
            done
          fi
