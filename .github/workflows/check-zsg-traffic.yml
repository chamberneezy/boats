name: Check ZSG traffic conditions

on:
  schedule:
    - cron: '0 5 * * *' # 07:00 Europe/Zurich (CEST); 06:00 once DST ends
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: npm run check:zsg-traffic
      # Only ever stages the checker's own two output files - never
      # src/data/zsgTrafficConditions.ts, which stays a manual update after review.
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add scripts/zsg-traffic-report.md scripts/zsg-traffic-baseline.txt
          if git diff --cached --quiet; then
            echo "No change to commit."
          else
            git commit -m "Daily ZSG traffic-conditions check"
            git push
          fi
