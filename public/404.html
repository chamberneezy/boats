<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Lacus</title>
    <script>
      // GitHub Pages has no server-side rewrites, so a direct visit or refresh on a deep
      // link (e.g. /boats/search/lake-lucerne?...) lands here. Turn the path into a query
      // string on the site root; index.html restores the real URL before the app starts.
      // Pattern: https://github.com/rafgraph/spa-github-pages
      // Keep in sync with the base path in vite.config.ts. Not needed on hosting that
      // rewrites every path to index.html (e.g. Firebase Hosting), where this file can go.
      var segmentsToKeep = 1;
      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + segmentsToKeep).join('/') + '/?/' +
        l.pathname.slice(1).split('/').slice(segmentsToKeep).join('/').replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body></body>
</html>
